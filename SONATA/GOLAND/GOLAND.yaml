
name: GOLAND wing benchmark
description: nn

components:
# ==== B L A D E ==== #
    blade:
        outer_shape_bem:
            airfoil_position:
                grid: [0.0, 0.5, 1.0]                              # radial stations in % (ovunque deve comparire lo stesso!)
                labels: [GOLAND, GOLAND, GOLAND]    # airfoil labels, comes from the name of the airfoil (defined below)
            chord:
                grid: [0.0, 0.5, 1.0] 
                values: [1.8228, 1.8228, 1.8228]                       # chord in m
            twist:
                grid: [0.0, 0.5, 1.0] 
                values: [0.0, 0.0, 0.0]                             # twist in deg ?!?!
            pitch_axis:
                grid: [0.0, 0.5, 1.0] 
                values: [0.0, 0.0, 0.0]                 # pitch/chord (chord value of the section)
            
            # x along the span, y along the chord, z along the thickness
            # it can introduce rotation
            reference_axis:
                x:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 3.048, 6.096]                         # x-coordinate of the reference axis in m
                y:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.601524, 0.601524, 0.601524]                      # y-coordinate of the reference axis in m
                z:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]                       # z-coordinate of the reference axis in m
            
            # definition of the point where the properties are calculated from
            beam_reference_axis:
                x:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 3.048, 6.096]                         # x-coordinate of the reference axis in m
                y:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.601524, 0.601524, 0.601524]                      # y-coordinate of the reference axis in m
                z:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]     

# ==== I N T E R N A L S T R U C T U R E ==== #
        internal_structure_2d_fem:
            sections:
              # for a consistent lamination, there must be a stacking sequence for each radial station

              # --- r/R = 0.0 ---
              - position: 0.0
                trim_mass: False
                mesh_resolution: 400 # ca 450 points on the outer curve - from inside to outside
                segments:
                  - id: 0
                    filler: 2     # if Null (no filler), if int (material id)
                    layup: 
                        #-[Start[-], End[-], thickness[m], Orientation [deg], MatID[int], 'name'[str]]
                      - [0., 1., 0.001, 0, 2, 'wall']
                      - [0.3, 0.4, 0.002, 0, 1, 'wall']
                      - [0.6, 0.7, 0.002, 0, 1, 'wall']

              # --- r/R = 0.5 ---
              - position: 0.5
                trim_mass: False
                mesh_resolution: 400 # ca 450 points on the outer curve - from inside to outside
                segments:
                  - id: 0
                    filler: 2
                    layup: 
                        #-[Start[-], End[-], thickness[m], Orientation [deg], MatID[int], 'name'[str]]
                      - [0., 1., 0.001, 0, 2, 'wall']
                      - [0.3, 0.4, 0.002, 0, 1, 'wall']
                      - [0.6, 0.7, 0.002, 0, 1, 'wall']
              
              # --- r/R = 1.0 ---
              - position: 1.0
                trim_mass: False
                mesh_resolution: 400 # ca 450 points on the outer curve - from inside to outside
                segments:
                  - id: 0
                    filler: 2
                    layup: 
                        #-[Start[-], End[-], thickness[m], Orientation [deg], MatID[int], 'name'[str]]
                      - [0., 1., 0.001, 0, 2, 'wall']
                      - [0.3, 0.4, 0.002, 0, 1, 'wall']
                      - [0.6, 0.7, 0.002, 0, 1, 'wall']



# ==== A I R F O I L S ==== #
airfoils:
   -  name: GOLAND
      coordinates: # follow s-coordinate along the outer profile of the structure, in SI units - m - unitary chord - from TE to LE and back to TE
           #x: [1.0000, 0.9500, 0.9000, 0.8000, 0.7000, 0.6000, 0.5000, 0.4000, 0.3000, 0.2500, 0.2000, 0.1500, 0.1000, 0.0750, 0.0500, 0.0250, 0.0125, 0.0000, 0.0125, 0.0250, 0.0500, 0.0750, 0.1000, 0.1500, 0.2000, 0.2500, 0.3000, 0.4000, 0.5000, 0.6000, 0.7000, 0.8000, 0.9000, 0.9500, 1.0000]
           #y: [0.00158, 0.01008, 0.01810, 0.03279, 0.04580, 0.05704, 0.06617, 0.07254, 0.07502, 0.07427, 0.07172, 0.06682, 0.05853, 0.05250, 0.04443, 0.03268, 0.02367, 0.00000, -0.02367, -0.03268,-0.04443, -0.05250, -0.05853, -0.06682, -0.07172, -0.07427, -0.07502, -0.07254, -0.06617, -0.05704, -0.04580, -0.03279, -0.01810, -0.01008, -0.00158]
           # 4% thick section
           x: [1.0000, 0.9500, 0.9000, 0.8000, 0.7000, 0.6000, 0.5000, 0.4000, 0.3000, 0.2500, 0.2000, 0.1500, 0.1000, 0.0750, 0.0500, 0.0250, 0.0125, 0.0000, 0.0125, 0.0250, 0.0500, 0.0750, 0.1000, 0.1500, 0.2000, 0.2500, 0.3000, 0.4000, 0.5000, 0.6000, 0.7000, 0.8000, 0.9000, 0.9500, 1.0000]
           y: [0.0000, -0.0038, -0.0072, -0.0128, -0.0168, -0.0192, -0.0200, -0.0192, -0.0168, -0.0150, -0.0128, -0.0102, -0.0072, -0.0057, -0.0038, -0.0019, -0.0010, 0.0000, 0.0010, 0.0019, 0.0038, 0.0057, 0.0072, 0.0102, 0.0128, 0.0150, 0.0168, 0.0192, 0.0200, 0.0192, 0.0168, 0.0128, 0.0072, 0.0038, 0.0000]

# ==== M A T E R I A L S ==== #
materials:
  # must be defined with id number starting from 1
  # units in SI

  - id: 1                                    # important, used as reference for the stacking sequence
    name: steel                              # optional
    description: Steel (isotropic material)  # "" 
    orth: 0                                  # 0 if isotropic, 1 if orthotropic
    rho: 8000                               # kg/m³
    E: 1e15                               # Young's modulus in Pa
    G: 8.08e14                               # Shear modulus in Pa
    nu: 0.3                                  # Poisson's ratio

  - id: 2
    name: Steel-orth
    description: basalto
    source: Campagna provini
    orth: 1
    rho: 290
    E_1: 2.1e7
    E_2: 2.1e11 
    E_3: 2.1e11 
    G_12: 8.08e10 
    G_13: 8.08e10 
    G_23: 8.08e10 
    nu_12: 0.31
    nu_13: 0.31
    nu_23: 0.31
    alpha_11:  Null
    alpha_22:  Null
    alpha_33:  Null

  - id: 3
    name: steel
    description: Steel (isotropic material)
    orth: 0
    rho: 7800
    E: 7.17e10
    G: 2.69e10
    nu: 0.3