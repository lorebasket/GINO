name: GOLAND wing benchmark - Simplified Model
description: |
  Simplified Goland wing model for SONATA.
  Note: The original Goland (1945) wing is a beam model with "equivalent" properties.
  This SONATA model uses a simplified structure that approximates the key characteristics:
  - Elastic Axis near 33% chord
  - Center of Gravity near 43% chord
  - Similar bending and torsional behavior
  
  The structure uses:
  - Main spar at ~33%c for bending/torsion stiffness
  - Additional mass aft of spar to shift CG
  - Calibrated materials to match target stiffnesses

components:
# ==== B L A D E ==== #
    blade:
        outer_shape_bem:
            airfoil_position:
                grid: [0.0, 0.5, 1.0]
                labels: [PARABOLIC_4PCT, PARABOLIC_4PCT, PARABOLIC_4PCT]
            chord:
                grid: [0.0, 0.5, 1.0]
                values: [1.8288, 1.8288, 1.8288]  # uniform 6 ft chord
            twist:
                grid: [0.0, 0.5, 1.0]
                values: [0.0, 0.0, 0.0]  # no twist
            pitch_axis:
                grid: [0.0, 0.5, 1.0]
                values: [0.33, 0.33, 0.33]  # elastic axis at 33% chord
            
            # Reference axis along span
            reference_axis:
                x:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 3.048, 6.096]  # 20 ft span
                y:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]
                z:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]
            
            # Beam reference axis (elastic axis)
            beam_reference_axis:
                x:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 3.048, 6.096]
                y:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]  # at elastic axis (33%c)
                z:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]

# ==== I N T E R N A L S T R U C T U R E ==== #
        internal_structure_2d_fem:
            sections:
              # Uniform structure along span
              
              # --- r/R = 0.0 (root) ---
              - position: 0.0
                trim_mass: False
                mesh_resolution: 200
                
                webs:
                  # Main spar at 33% chord (elastic axis)
                  - start_nd_arc:
                      grid: [0., 1.]
                      values: [0.33, 0.33]  # position along airfoil curve
                    end_nd_arc:
                      grid: [0., 1.]
                      values: [0.67, 0.67]  # from lower to upper surface
                    width:
                      grid: [0., 1.]
                      values: [0.008, 0.008]  # 8mm spar web
                    # Compatibility fields for SONATA CBMConfig parser
                    id: 1
                    position: [0.33, 0.67]
                    # Explicit start/end and curvature to help topology builder
                    start: 0.33
                    end: 0.67
                    curvature: 0.0
                    webs_id: [1]
                
                segments:
                  # Structural zone around spar (25%-40% chord)
                  - id: 0
                    # explicit start/end of this segment along normalized chord
                    start: 0.25
                    end: 0.40
                    filler: Null
                    layup: 
                      - [0.25, 0.40, 0.003, 0, 1, 'spar_box']  # 3mm structural skin
                  
                  # Mass ballast zone (40%-46% chord) - to shift CG aft
                  - id: 1
                    # explicit start/end of this segment along normalized chord
                    start: 0.40
                    end: 0.46
                    filler: 2  # filled with dense material
                    layup:
                      - [0.40, 0.46, 0.002, 0, 2, 'ballast_zone']
                  
                  # Light skin (rest of airfoil)
                  - id: 2
                    # explicit start/end of this segment along normalized chord
                    start: 0.00
                    end: 1.00
                    filler: Null
                    layup:
                      - [0.00, 0.25, 0.0005, 0, 3, 'light_skin']  # 0.5mm
                      - [0.46, 1.00, 0.0005, 0, 3, 'light_skin']
                
                # Web layup definition
                layup_web:
                  - id: 1
                    layers:
                      - [0., 1., 0.008, 0, 1, 'main_spar_web']

              # --- r/R = 0.5 (mid-span) ---
              - position: 0.5
                trim_mass: False
                mesh_resolution: 200
                
                webs:
                  - start_nd_arc:
                      grid: [0., 1.]
                      values: [0.33, 0.33]
                    end_nd_arc:
                      grid: [0., 1.]
                      values: [0.67, 0.67]
                    width:
                      grid: [0., 1.]
                      values: [0.008, 0.008]
                    # Compatibility fields for SONATA CBMConfig parser
                    id: 1
                    position: [0.33, 0.67]
                    start: 0.33
                    end: 0.67
                    curvature: 0.0
                    webs_id: [1]
                
                segments:
                  - id: 0
                    filler: Null
                    layup: 
                      - [0.25, 0.40, 0.003, 0, 1, 'spar_box']
                  - id: 1
                    filler: 2
                    layup:
                      - [0.40, 0.46, 0.002, 0, 2, 'ballast_zone']
                  - id: 2
                    filler: Null
                    layup:
                      - [0.00, 0.25, 0.0005, 0, 3, 'light_skin']
                      - [0.46, 1.00, 0.0005, 0, 3, 'light_skin']
                
                layup_web:
                  - id: 1
                    layers:
                      - [0., 1., 0.008, 0, 1, 'main_spar_web']

              # --- r/R = 1.0 (tip) ---
              - position: 1.0
                trim_mass: False
                mesh_resolution: 200
                
                webs:
                  - start_nd_arc:
                      grid: [0., 1.]
                      values: [0.33, 0.33]
                    end_nd_arc:
                      grid: [0., 1.]
                      values: [0.67, 0.67]
                    width:
                      grid: [0., 1.]
                      values: [0.008, 0.008]
                    # Compatibility fields for SONATA CBMConfig parser
                    id: 1
                    position: [0.33, 0.67]
                    start: 0.33
                    end: 0.67
                    curvature: 0.0
                    webs_id: [1]
                
                segments:
                  - id: 0
                    filler: Null
                    layup: 
                      - [0.25, 0.40, 0.003, 0, 1, 'spar_box']
                  - id: 1
                    filler: 2
                    layup:
                      - [0.40, 0.46, 0.002, 0, 2, 'ballast_zone']
                  - id: 2
                    filler: Null
                    layup:
                      - [0.00, 0.25, 0.0005, 0, 3, 'light_skin']
                      - [0.46, 1.00, 0.0005, 0, 3, 'light_skin']
                
                layup_web:
                  - id: 1
                    layers:
                      - [0., 1., 0.008, 0, 1, 'main_spar_web']


# ==== A I R F O I L S ==== #
airfoils:
   -  name: PARABOLIC_4PCT
      coordinates:
           # 4% thick parabolic arc (Goland specification)
           x: [1.0000, 0.9500, 0.9000, 0.8000, 0.7000, 0.6000, 0.5000, 0.4000, 0.3000, 0.2500, 0.2000, 0.1500, 0.1000, 0.0750, 0.0500, 0.0250, 0.0125, 0.0000, 0.0125, 0.0250, 0.0500, 0.0750, 0.1000, 0.1500, 0.2000, 0.2500, 0.3000, 0.4000, 0.5000, 0.6000, 0.7000, 0.8000, 0.9000, 0.9500, 1.0000]
           y: [0.0000, -0.0038, -0.0072, -0.0128, -0.0168, -0.0192, -0.0200, -0.0192, -0.0168, -0.0150, -0.0128, -0.0102, -0.0072, -0.0057, -0.0038, -0.0019, -0.0010, 0.0000, 0.0010, 0.0019, 0.0038, 0.0057, 0.0072, 0.0102, 0.0128, 0.0150, 0.0168, 0.0192, 0.0200, 0.0192, 0.0168, 0.0128, 0.0072, 0.0038, 0.0000]

# ==== M A T E R I A L S ==== #
materials:
  # Material 1: Structural material (spar and box)
  # Scaled to provide appropriate stiffness
  - id: 1
    name: structural_calibrated
    description: Calibrated structural material for Goland stiffness
    orth: 0
    rho: 2700    # kg/m³ (aluminum-like density)
    E: 2.0e11    # Pa (200 GPa - high but realistic for composites)
    G: 7.7e10    # Pa 
    nu: 0.30

  # Material 2: Dense ballast (to shift CG aft)
  - id: 2
    name: dense_ballast
    description: Dense material to position CG at 43% chord
    orth: 0
    rho: 8000    # kg/m³ (steel-like, will need tuning)
    E: 2.1e11    # Pa (stiff enough)
    G: 8.1e10    # Pa
    nu: 0.30

  # Material 3: Light skin
  - id: 3
    name: light_skin
    description: Lightweight skin material
    orth: 0
    rho: 500     # kg/m³ (very light)
    E: 3.0e10    # Pa (moderate stiffness)
    G: 1.15e10   # Pa
    nu: 0.30

# ==== N O T E S ==== #
# This is a simplified model that attempts to approximate Goland wing behavior.
# Key differences from original Goland (1945):
# 
# Original Goland:               This Model:
# - Pure beam model              - 2D FEM cross-section
# - EI = 9.77e6 N·m²            - Approximated through structure
# - GJ = 0.99e6 N·m²            - Approximated through closed box
# - m = 35.71 kg/m              - Tuned via material densities
# - EA at 33%c, CG at 43%c      - Approximated via spar position + ballast
# 
# For exact Goland properties, consider using a pure beam model or 
# custom material properties calculated from your analysis.
# 
# To tune this model:
# 1. Run SONATA cross-section analysis
# 2. Check calculated EI, GJ, mass, CG, EA positions
# 3. Adjust material densities (rho) to match mass and CG
# 4. Adjust material stiffnesses (E, G) to match EI and GJ
# 5. Adjust thickness values if needed