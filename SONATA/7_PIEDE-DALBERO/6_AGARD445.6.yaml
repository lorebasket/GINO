name: 7_PIEDE-D'ALBERO
description: Fem validation example, AGARD445.6 airfoil semispan beam

components:
# ==== B L A D E ==== #
    blade:
        outer_shape_bem:
            airfoil_position:
                grid: [0.0, 0.5, 1.0]
                labels: [AGARD445.60, AGARD445.60, AGARD445.60]
            chord:
                grid: [0.0, 0.5, 1.0]
                #values: [1., 1., 1.]  # normalized chord
                values: [0.559, 0.463, 0.368]  # normalized chord
            twist:
                grid: [0.0, 0.5, 1.0]
                values: [0.0, 0.0, 0.0]
            pitch_axis:
                grid: [0.0, 0.5, 1.0]
                # values: [0.0, -0.381/0.463, -0.762/0.368]
                values: [0.0, -0.822, -2.070]
            reference_axis:
                x:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.381, 0.762]
                y:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]
                z:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]
            beam_reference_axis:
                x:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.381, 0.762]
                y:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, -0.381, -0.762]
                z:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]

# ==== I N T E R N A L S T R U C T U R E ==== #
        internal_structure_2d_fem:
            sections:
              # --- r/R = 0.0 ---
              - position: 0.0
                trim_mass: False
                mesh_resolution: 500 # ca 450 points on the outer curve - from inside to outside
                segments:
                  - id: 0
                    filler: 2
                    layup: 
                        #-[Start[-], End[-], thickness[m], Orientation [deg], MatID[int], 'name'[str]]
                      - [0., 1., 0.0005,   0, 2, 'wall']


              # --- r/R = 0.5 ---
              - position: 0.5
                trim_mass: False
                mesh_resolution: 500 # ca 450 points on the outer curve - from inside to outside
                segments:
                  - id: 0
                    filler: 2
                    layup: 
                        #-[Start[-], End[-], thickness[m], Orientation [deg], MatID[int], 'name'[str]]
                      - [0., 1., 0.0005,   0, 2, 'wall']
            
              # --- r/R = 1.0 ---
              - position: 1.0
                trim_mass: False
                mesh_resolution: 500 # ca 450 points on the outer curve - from inside to outside
                segments:
                  - id: 0
                    filler: 2
                    layup: 
                        #-[Start[-], End[-], thickness[m], Orientation [deg], MatID[int], 'name'[str]]
                      - [0., 1., 0.0005,   0, 2, 'wall']


