name: hollowell 1982 - FINAL VALIDATED
description: Rectangular laminate plate [+45/-45/0/0/-45/+45] - Validated configuration

components:
# ==== B L A D E ==== #
    blade:
        outer_shape_bem:
            airfoil_position:
                grid: [0.0, 0.5, 1.0]
                labels: [section, section, section]
            chord:
                grid: [0.0, 0.5, 1.0] 
                values: [1., 1., 1.]
            twist:
                grid: [0.0, 0.5, 1.0] 
                values: [0.0, 0.0, 0.0]
            pitch_axis:
                grid: [0.0, 0.5, 1.0] 
                values: [0.026296, 0.045096, 0.063899]
            
            reference_axis:
                x:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.07, 0.140]
                y:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0]
                z:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0] 

            beam_reference_axis:
                x:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.07, 0.140]
                y:
                    grid: [0.0, 0.5, 1.0]
                    values: [-0.026296, -0.045096, -0.063899]
                z:
                    grid: [0.0, 0.5, 1.0]
                    values: [0.0, 0.0, 0.0] 

# ==== I N T E R N A L S T R U C T U R E ==== #
        internal_structure_2d_fem:
            sections:
              # --- r/R = 0.0 ---
              - position: 0.0
                trim_mass: False
                mesh_resolution: 500  # Alta risoluzione per accuratezza
                segments:
                  - id: 0
                    filler: 2
                    layup: 
                      - [0.0, 1., 0.0001, 0, 2, 'ply1']

              # --- r/R = 0.5 ---
              - position: 0.5
                trim_mass: False
                mesh_resolution: 500
                segments:
                  - id: 0
                    filler: Null
                    filler: 2
                    layup: 
                      - [0.0, 1., 0.0001, 0, 2, 'ply1']
              
              # --- r/R = 1.0 ---
              - position: 1.0
                trim_mass: False
                mesh_resolution: 500
                segments:
                  - id: 0
                    filler: 2
                    layup: 
                      - [0.0, 1., 0.0001, 0, 2, 'ply1']


# ==== A I R F O I L S ==== #
airfoils:
   # Rectangular cross-section: 76mm × 0.798mm
   # CRITICAL: Starting from RIGHT (x=+0.038, y=0), going COUNTER-CLOCKWISE
   # This is required by SONATA conventions
   #
   # Perimeter breakdown:
   #   Point 0→1: Right edge (0.402mm) - Segment 0.000 to 0.002617
   #   Point 1→2: Bottom edge (76mm)   - Segment 0.002617 to 0.497383 ← LAYUP HERE
   #   Point 2→3: Left edge (0.804mm)  - Segment 0.497383 to 0.502617
   #   Point 3→4: Top edge (76mm)      - Segment 0.502617 to 0.997383
   #   Point 4→0: Right edge (0.402mm) - Segment 0.997383 to 1.000000
   #
   -  name: section
      coordinates:
           # 6 points for closed contour (5 unique + 1 closure)
           # Units: meters
           x: [0.026296, 0.019721, -0.019721, -0.026296, -0.019721, 0.019721, 0.026296]
           y: [0.0, +0.0005207, +0.0005207, 0.0, -0.0005207, -0.0005207, 0.0]

# ==== M A T E R I A L S ==== #
materials:

  - id: 1
    name: AS1/3501-6 Graphite/Epoxy
    description: Hercules AS1/3501-6 unidirectional graphite/epoxy tape (Hollowell 1982)
    orth: 1
    rho: 1520      # kg/m³
    # In-plane properties (from Hollowell paper)
    E_1: 98e9      # Pa (98 GPa)
    E_2: 7.9e9     # Pa (7.9 GPa)
    E_3: 7.9e9     # Pa (assumed = E_2 for transverse isotropy)
    G_12: 5.6e9    # Pa (5.6 GPa)
    G_13: 5.6e9    # Pa (assumed = G_12)
    G_23: 3.09e9   # Pa (calculated from E_2/(2(1+nu_23)))
    nu_12: 0.28
    nu_13: 0.28    # assumed
    nu_23: 0.28    # assumed
    alpha_11: Null
    alpha_22: Null
    alpha_33: Null

  - id: 2
    name: steel_nastran
    description: Nastran-like metal, pg. 259 of Nastran manual
    orth: 0
    rho: 2767.99     # kg/m³ (very light)
    E: 6.3719968e10    # Pa (moderate stiffness)
    G: 2.4126824e+10   # Pa
    nu: 0.30
