name: NACA0012
description: Fem validation example, NACA0012 airfoil full span beam, SHanghai paper

components:
# ==== B L A D E ==== #
    blade:
        outer_shape_bem:
            airfoil_position:
                grid: [0.0, 1.0]
                labels: [NACA0012, NACA0012]
            chord:
                grid: [0.0, 1.0]
                values: [1., 1.]  # normalized chord
            twist:
                grid: [0.0, 1.0]
                values: [0.0, 0.0]
            pitch_axis:
                grid: [0.0, 1.0]
                values: [0.0, 0.0]
            reference_axis:
                x:
                    grid: [0.0, 1.0]
                    values: [0.0, 0.305]
                y:
                    grid: [0.0, 1.0]
                    values: [0.0, 0.0]
                z:
                    grid: [0.0, 1.0]
                    values: [0.0, 0.0]
            beam_reference_axis:
                x:
                    grid: [0.0, 1.0]
                    values: [0.0, 0.305]
                y:
                    grid: [0.0, 1.0]
                    values: [0.0, 0.0]
                z:
                    grid: [0.0, 1.0]
                    values: [0.0, 0.0]

# ==== I N T E R N A L S T R U C T U R E ==== #
        internal_structure_2d_fem:
            sections:
              # --- r/R = 0.0 ---
              - position: 0.0
                trim_mass: False
                mesh_resolution: 500 # ca 450 points on the outer curve - from inside to outside
                segments:
                  - id: 0
                    filler: Null
                    layup: 
                        #-[Start[-], End[-], thickness[m], Orientation [deg], MatID[int], 'name'[str]]
                      - [0., 1., 0.0016,   0, 1, 'wall']

              # --- r/R = 1.0 ---
              - position: 1.0
                trim_mass: False
                mesh_resolution: 500 # ca 450 points on the outer curve - from inside to outside
                segments:
                  - id: 0
                    filler: Null
                    layup: 
                        #-[Start[-], End[-], thickness[m], Orientation [deg], MatID[int], 'name'[str]]
                      - [0., 1., 0.0016,   0, 1, 'wall']

